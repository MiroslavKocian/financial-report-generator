<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Report Generator</title>
</head>
<body>
    <h1>Financial Report Generator</h1>
    <p>Upload your Excel sales report to begin.</p>

    <form action="/uploadfile/" enctype="multipart/form-data" method="post">
        <label for="file-upload">Select Excel File:</label>
        <input id="file-upload" name="file" type="file" accept=".xlsx, .xls" required>
        <input type="submit" value="Upload and Analyze">
    </form>
</body>
</html>
