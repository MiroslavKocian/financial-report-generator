<!-- Upload form and link to the sales summary report. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Report Generator</title>
</head>
<body>
    <header>
        <h1>Financial Report Generator</h1>
        <p>
            Upload one Excel file with an amount column. The summary shows
            total, minimum, and maximum amount.
        </p>
    </header>

    <main>
        <!-- multipart/form-data is required for binary file uploads -->
        <form action="/uploadfile/" enctype="multipart/form-data" method="post">
            <label for="file-upload">Select Excel File:</label>
            <input
                id="file-upload"
                name="file"
                type="file"
                accept=".xlsx, .xls"
                required
            >
            <input type="submit" value="Upload and Store">
        </form>
        <p><a href="/summary">View summary report</a></p>
    </main>

    <footer>
        <small>Financial Report Generator</small>
    </footer>
</body>
</html>
