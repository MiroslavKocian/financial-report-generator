<!--
  File: index.html
  Description: Upload form for Excel sales files (.xlsx, .xls).
  Submits to FastAPI /uploadfile/ for disk + SQLite storage.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Report Generator</title>
</head>
<body>
    <header>
        <h1>Financial Report Generator</h1>
        <p>Upload an Excel sales file to store raw data in SQLite.</p>
    </header>

    <main>
        <!-- multipart/form-data is required for binary file uploads -->
        <form action="/uploadfile/" enctype="multipart/form-data" method="post">
            <label for="file-upload">Select Excel File:</label>
            <input
                id="file-upload"
                name="file"
                type="file"
                accept=".xlsx, .xls"
                required
            >
            <input type="submit" value="Upload and Store">
        </form>
    </main>

    <footer>
        <small>Financial Report Generator</small>
    </footer>
</body>
</html>
